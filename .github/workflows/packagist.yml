name: packagist

on:
  push:
    tags:
      - '*'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Packagist
        shell: bash
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          url="https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
          body="$(printf '{"repository":{"url":"%s"}}' "${REPOSITORY_URL}")"

          status="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data "${body}" \
            "${url}")"

          echo "HTTP status: ${status}"
          cat response.json
          echo

          case "${status}" in
            2[0-9][0-9]) ;;
            *)
              echo "Packagist update failed with status ${status}" >&2
              exit 1
              ;;
          esac
